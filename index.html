<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة شدة الطرنيب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d2818;
            --card-bg: rgba(16, 44, 27, 0.95);
            --accent-gold: #e5a93b;
            --text-light: #f4f6f0;
            --text-muted: #a3b899;
            --team-a-color: #4ea8de;
            --team-b-color: #f72585;
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #164229 0%, #08190e 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        header {
            text-align: center;
            padding: 10px 0;
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .settings-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .scoreboard {
            background: var(--card-bg);
            border: 2px solid rgba(229, 169, 59, 0.3);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .team-score {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .team-a .team-name { color: var(--team-a-color); }
        .team-b .team-name { color: var(--team-b-color); }

        .score-val {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            margin: 5px 0;
        }

        .divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--accent-gold), transparent);
            margin: 0 10px;
        }

        .target-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gold);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .card-panel {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .select-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-option.selected-a {
            background: rgba(78, 168, 222, 0.25);
            border-color: var(--team-a-color);
            color: var(--team-a-color);
        }

        .btn-option.selected-b {
            background: rgba(247, 37, 133, 0.25);
            border-color: var(--team-b-color);
            color: var(--team-b-color);
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .num-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .num-btn.selected {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b88222 100%);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .history-table th, .history-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-undo {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #122b1c;
            border: 1px solid var(--accent-gold);
            border-radius: var(--border-radius);
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>حاسبة الطرنيب</h1>
        <p>حساب نقاط اللعبة بسهولة</p>
        <button class="settings-btn" onclick="openSettingsModal()">الإعدادات ⚙️</button>
    </header>

    <div class="scoreboard">
        <div class="target-badge">الهدف: <span id="targetScoreDisplay">41</span></div>
        <div class="team-score team-a">
            <div class="team-name" id="nameDisplayA">الفريق الأول</div>
            <div class="score-val" id="scoreDisplayA">0</div>
        </div>
        <div class="divider"></div>
        <div class="team-score team-b">
            <div class="team-name" id="nameDisplayB">الفريق الثاني</div>
            <div class="score-val" id="scoreDisplayB">0</div>
        </div>
    </div>

    <div class="card-panel">
        <div class="panel-title">تسجيل جولة جديدة</div>
        
        <div class="form-group">
            <label>الفريق الشارط:</label>
            <div class="select-buttons">
                <div class="btn-option selected-a" id="bidderA" onclick="selectBidder('A')">الفريق الأول</div>
                <div class="btn-option" id="bidderB" onclick="selectBidder('B')">الفريق الثاني</div>
            </div>
        </div>

        <div class="form-group">
            <label>الشرط المطلوبة:</label>
            <div class="number-grid" id="bidGrid"></div>
        </div>

        <div class="form-group">
            <label>الأكلات التي حققها الشارط:</label>
            <div class="number-grid" id="tricksGrid"></div>
        </div>

        <button class="btn-primary" onclick="addRound()">تسجيل الجولة</button>
    </div>

    <div class="card-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="panel-title" style="margin:0;">سجل الجولات</div>
            <button class="btn-undo" onclick="undoLastRound()">تراجع ↩️</button>
        </div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>الشارط</th>
                    <th>الشرط</th>
                    <th>المحقق</th>
                    <th id="thNameA">فريق 1</th>
                    <th id="thNameB">فريق 2</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h2 style="color: var(--accent-gold); margin-bottom: 15px;">الإعدادات</h2>
        <div class="form-group">
            <label>اسم الفريق الأول:</label>
            <input type="text" id="inputTeamA" value="الفريق الأول">
        </div>
        <div class="form-group">
            <label>اسم الفريق الثاني:</label>
            <input type="text" id="inputTeamB" value="الفريق الثاني">
        </div>
        <div class="form-group">
            <label>نقاط الهدف:</label>
            <select id="inputTarget">
                <option value="41">41</option>
                <option value="61">61</option>
                <option value="31">31</option>
            </select>
        </div>
        <button class="btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
        <button class="btn-option" onclick="closeSettingsModal()" style="width:100%; margin-top: 8px;">إلغاء</button>
        <button class="btn-undo" style="width:100%; margin-top: 15px; padding:8px;" onclick="resetGame()">تصفير اللعبة بالكامل 🔄</button>
    </div>
</div>

<script>
    var teamA = "الفريق الأول";
    var teamB = "الفريق الثاني";
    var targetScore = 41;
    var scoreA = 0;
    var scoreB = 0;
    var rounds = [];
    var currentBidder = 'A';
    var currentBid = 7;
    var currentTricks = 7;

    window.onload = function() {
        renderBidGrid();
        renderTricksGrid();
        updateUI();
    };

    function selectBidder(team) {
        currentBidder = team;
        document.getElementById('bidderA').className = "btn-option " + (team === 'A' ? 'selected-a' : '');
        document.getElementById('bidderB').className = "btn-option " + (team === 'B' ? 'selected-b' : '');
    }

    function renderBidGrid() {
        var grid = document.getElementById('bidGrid');
        grid.innerHTML = '';
        for (var i = 7; i <= 13; i++) {
            (function(num) {
                var btn = document.createElement('button');
                btn.className = "num-btn " + (currentBid === num ? 'selected' : '');
                btn.innerText = num === 13 ? 'كبوت' : num;
                btn.onclick = function() {
                    currentBid = num;
                    if (currentTricks < num) currentTricks = num;
                    renderBidGrid();
                    renderTricksGrid();
                };
                grid.appendChild(btn);
            })(i);
        }
    }

    function renderTricksGrid() {
        var grid = document.getElementById('tricksGrid');
        grid.innerHTML = '';
        for (var i = 0; i <= 13; i++) {
            (function(num) {
                var btn = document.createElement('button');
                btn.className = "num-btn " + (currentTricks === num ? 'selected' : '');
                btn.innerText = num;
                btn.onclick = function() {
                    currentTricks = num;
                    renderTricksGrid();
                };
                grid.appendChild(btn);
            })(i);
        }
    }

    function addRound() {
        var pointsA = 0;
        var pointsB = 0;

        if (currentBidder === 'A') {
            if (currentTricks >= currentBid) {
                pointsA = currentTricks;
                pointsB = 0;
            } else {
                pointsA = -currentBid;
                pointsB = 13 - currentTricks;
            }
        } else {
            if (currentTricks >= currentBid) {
                pointsB = currentTricks;
                pointsA = 0;
            } else {
                pointsB = -currentBid;
                pointsA = 13 - currentTricks;
            }
        }

        scoreA += pointsA;
        scoreB += pointsB;

        rounds.push({
            bidder: currentBidder,
            bid: currentBid,
            tricks: currentTricks,
            pointsA: pointsA,
            pointsB: pointsB,
            totalA: scoreA,
            totalB: scoreB
        });

        updateUI();
        checkWinner();
    }

    function undoLastRound() {
        if (rounds.length === 0) return;
        var last = rounds.pop();
        scoreA -= last.pointsA;
        scoreB -= last.pointsB;
        updateUI();
    }

    function updateUI() {
        document.getElementById('scoreDisplayA').innerText = scoreA;
        document.getElementById('scoreDisplayB').innerText = scoreB;
        document.getElementById('nameDisplayA').innerText = teamA;
        document.getElementById('nameDisplayB').innerText = teamB;
        document.getElementById('thNameA').innerText = teamA;
        document.getElementById('thNameB').innerText = teamB;
        document.getElementById('bidderA').innerText = teamA;
        document.getElementById('bidderB').innerText = teamB;
        document.getElementById('targetScoreDisplay').innerText = targetScore;

        var tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        for (var i = 0; i < rounds.length; i++) {
            var r = rounds[i];
            var tr = document.createElement('tr');
            var bidderName = r.bidder === 'A' ? teamA : teamB;
            var strA = r.pointsA > 0 ? ('+' + r.pointsA) : r.pointsA;
            var strB = r.pointsB > 0 ? ('+' + r.pointsB) : r.pointsB;

            tr.innerHTML = '<td>' + (i + 1) + '</td>' +
                           '<td>' + bidderName + '</td>' +
                           '<td>' + (r.bid === 13 ? 'كبوت' : r.bid) + '</td>' +
                           '<td>' + r.tricks + '</td>' +
                           '<td>' + strA + ' (' + r.totalA + ')</td>' +
                           '<td>' + strB + ' (' + r.totalB + ')</td>';
            tbody.insertBefore(tr, tbody.firstChild);
        }
    }

    function checkWinner() {
        if (scoreA >= targetScore && scoreA > scoreB) {
            alert("مبروك! فاز " + teamA);
        } else if (scoreB >= targetScore && scoreB > scoreA) {
            alert("مبروك! فاز " + teamB);
        }
    }

    function openSettingsModal() {
        document.getElementById('inputTeamA').value = teamA;
        document.getElementById('inputTeamB').value = teamB;
        document.getElementById('inputTarget').value = targetScore;
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettingsModal() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
        teamA = document.getElementById('inputTeamA').value || "الفريق الأول";
        teamB = document.getElementById('inputTeamB').value || "الفريق الثاني";
        targetScore = parseInt(document.getElementById('inputTarget').value);
        updateUI();
        closeSettingsModal();
    }

    function resetGame() {
        scoreA = 0;
        scoreB = 0;
        rounds = [];
        updateUI();
        closeSettingsModal();
    }
</script>
</body>
</html>
