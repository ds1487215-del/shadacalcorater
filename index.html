<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة شدة الطرنيب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d2818;
            --card-bg: rgba(16, 44, 27, 0.85);
            --accent-gold: #e5a93b;
            --accent-gold-hover: #f5ba4c;
            --text-light: #f4f6f0;
            --text-muted: #a3b899;
            --team-a-color: #4ea8de;
            --team-b-color: #f72585;
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #164229 0%, #08190e 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        header {
            text-align: center;
            padding: 10px 0;
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .settings-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .scoreboard {
            background: var(--card-bg);
            border: 2px solid rgba(229, 169, 59, 0.3);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .team-score {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-a .team-name { color: var(--team-a-color); }
        .team-b .team-name { color: var(--team-b-color); }

        .score-val {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            margin: 5px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--accent-gold), transparent);
            margin: 0 10px;
        }

        .target-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gold);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .progress-container {
            width: 100%;
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
