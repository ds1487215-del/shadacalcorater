<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الطرنيب</title>
    <style>
        body { font-family: sans-serif; background: #0d2818; color: #fff; padding: 15px; text-align: center; }
        .box { background: #164229; border: 2px solid #e5a93b; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .scores { display: flex; justify-content: space-around; font-size: 1.5rem; }
        .score-val { font-size: 2.5rem; color: #e5a93b; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #e5a93b; color: #000; font-weight: bold; cursor: pointer; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    </style>
</head>
<body>

    <h2>حاسبة شدة الطرنيب</h2>

    <div class="box">
        <div class="scores">
            <div><div id="nA">الفريق الأول</div><div class="score-val" id="sA">0</div></div>
            <div>|</div>
            <div><div id="nB">الفريق الثاني</div><div class="score-val" id="sB">0</div></div>
        </div>
    </div>

    <div class="box">
        <h3>تسجيل جولة</h3>
        <label>الفريق الشارط:</label>
        <select id="bidder">
            <option value="A">الفريق الأول</option>
            <option value="B">الفريق الثاني</option>
        </select>

        <label>الشرط (7 - 13):</label>
        <input type="number" id="bid" min="7" max="13" value="7">

        <label>الأكلات المحققة:</label>
        <input type="number" id="tricks" min="0" max="13" value="7">

        <button onclick="addRound()">تسجيل</button>
        <button onclick="undoRound()" style="background:#ff4d4d; color:#fff; margin-top:5px;">تراجع ↩️</button>
    </div>

    <div class="box">
        <h3>سجل الجولات</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الشارط</th>
                    <th>فريق 1</th>
                    <th>فريق 2</th>
                </tr>
            </thead>
            <tbody id="history"></tbody>
        </table>
    </div>

<script>
    let sA = 0, sB = 0, rounds = [];

    function addRound() {
        let bidder = document.getElementById('bidder').value;
        let bid = parseInt(document.getElementById('bid').value);
        let tricks = parseInt(document.getElementById('tricks').value);

        let pA = 0, pB = 0;

        if (bidder === 'A') {
            if (tricks >= bid) { pA = tricks; pB = 0; }
            else { pA = -bid; pB = 13 - tricks; }
        } else {
            if (tricks >= bid) { pB = tricks; pA = 0; }
            else { pB = -bid; pA = 13 - tricks; }
        }

        sA += pA; sB += pB;
        rounds.push({ bidder, pA, pB, totalA: sA, totalB: sB });
        update();
    }

    function undoRound() {
        if (rounds.length === 0) return;
        let r = rounds.pop();
        sA -= r.pA; sB -= r.pB;
        update();
    }

    function update() {
        document.getElementById('sA').innerText = sA;
        document.getElementById('sB').innerText = sB;
        let tbody = document.getElementById('history');
        tbody.innerHTML = '';
        rounds.forEach((r, i) => {
            let row = `<tr>
                <td>${i + 1}</td>
                <td>${r.bidder === 'A' ? 'فريق 1' : 'فريق 2'}</td>
                <td>${r.pA} (${r.totalA})</td>
                <td>${r.pB} (${r.totalB})</td>
            </tr>`;
            tbody.innerHTML = row + tbody.innerHTML;
        });

        if (sA >= 41 && sA > sB) alert("فاز الفريق الأول!");
        if (sB >= 41 && sB > sA) alert("فاز الفريق الثاني!");
    }
</script>
</body>
</html>
